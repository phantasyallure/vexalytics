<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vexalytics — Social & website analytics</title><meta name="description" content="Instagram, Facebook, TikTok and website analytics in one dashboard.">
<meta name="theme-color" content="#0d0610"><link rel="icon" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/shared.css">
<style>
nav{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:var(--nav);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
nav .wrap{display:flex;align-items:center;gap:16px;height:64px}nav img{height:30px}.links{display:flex;gap:22px;margin-inline:auto;color:var(--mute);font-size:15px}.links a:hover{color:var(--ink)}.acts{display:flex;gap:10px;align-items:center}
.hero{position:relative;overflow:hidden;padding:84px 0 70px}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 6%,var(--hs) 50%,transparent),url(/hero.jpg) center/cover;opacity:var(--ho);z-index:-1}
:root{--hs:#0d0610aa;--ho:.55}html[data-m=light]{--hs:#e9dce699;--ho:.85}
[dir=rtl] .hero:before{background:linear-gradient(270deg,var(--bg) 6%,var(--hs) 50%,transparent),url(/hero.jpg) center/cover}
.hero h1{font-size:clamp(34px,6vw,64px);line-height:1.08;letter-spacing:-.02em;max-width:760px}.hero h1 span{background:linear-gradient(135deg,#ff7ac0,var(--a1));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--soft);font-size:clamp(16px,2.2vw,19px);max-width:560px;margin:20px 0 28px}.hero .row{display:flex;gap:12px;flex-wrap:wrap}.hero small{display:block;margin-top:16px;color:var(--mute)}
section{padding:68px 0}h2{font-size:clamp(26px,4vw,38px);letter-spacing:-.01em;margin-bottom:34px;text-align:center}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.card h3{font-size:18px;margin:12px 0 6px}.card p{color:var(--mute);font-size:15px}
.ic{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#ff2d9533,#b4137a22);border:1px solid #ff2d9544;display:grid;place-items:center;font-size:20px}
.step b{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));margin-bottom:6px}
.tog{display:flex;justify-content:center;gap:6px;margin:-14px auto 30px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;width:max-content;max-width:100%}.tog button{border:0;background:none;color:var(--mute);font:600 14px inherit;font-family:inherit;padding:9px 18px;border-radius:9px;cursor:pointer}.tog button.on{background:var(--a1);color:#fff}.tog em{font-style:normal;font-size:12px;color:var(--ok);margin-inline-start:6px}
.plan{position:relative;display:flex;flex-direction:column}.plan.pop{border-color:var(--a1);box-shadow:0 0 0 1px var(--a1),0 20px 50px #ff2d9522}.plan .badge{position:absolute;top:-12px;inset-inline-start:20px;background:var(--a1);font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.price{font-size:38px;font-weight:800;margin:10px 0 2px}.price small{font-size:14px;color:var(--mute);font-weight:500}.plan ul{list-style:none;padding:0;margin:16px 0 22px;flex:1}.plan li{padding:6px 0;color:var(--soft);font-size:15px}.plan li:before{content:"✓";color:var(--ok);margin-inline-end:8px;font-weight:700}
.note{text-align:center;color:var(--mute);font-size:14px;margin-top:20px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:12px}summary{cursor:pointer;font-weight:600}details p{color:var(--mute);margin-top:10px;font-size:15px}
footer{border-top:1px solid var(--line);padding:40px 0 calc(30px + env(safe-area-inset-bottom));color:var(--mute);font-size:14px}footer .wrap{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center}footer img{height:28px;margin-bottom:8px}footer nav{all:unset;display:flex;gap:18px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:50;padding:16px}.modal.open{display:grid}.box{width:min(420px,100%);position:relative}.box h3{font-size:22px}.x{position:absolute;top:12px;inset-inline-end:14px;background:none;border:0;color:var(--mute);font-size:24px;cursor:pointer}
.lnk{background:none;border:0;color:var(--a1);font:inherit;cursor:pointer;padding:0}.sw{margin-top:14px;font-size:14px;color:var(--mute);text-align:center}
@media(max-width:760px){.links{display:none}nav .wrap{gap:8px}.hero{padding:48px 0 44px}.acts .btn.ghost{display:none}section{padding:46px 0}}
</style></head><body>
<nav><div class="wrap"><a href="/"><img src="/logo-wordmark.png" alt="Vexalytics"></a>
<div class="links"><a href="#features" data-i="features"></a><a href="#how" data-i="how"></a><a href="#pricing" data-i="pricing"></a><a href="#policy" data-i="policy"></a></div>
<div class="acts"><div class="lang"><button data-l="en">EN</button><button data-l="fr">FR</button><button data-l="ar">ع</button></div><button class="thm" id="thm" type="button" aria-label="Theme"></button><button class="btn ghost sm" onclick="openM('login')" data-i="login"></button><button class="btn sm" onclick="openM('signup')" data-i="start"></button></div></div></nav>
<header class="hero"><div class="wrap"><h1><span data-i="h1a"></span> <span data-i="h1b" style="-webkit-text-fill-color:var(--ink);color:var(--ink)"></span></h1><p data-i="sub"></p>
<div class="row"><button class="btn" onclick="openM('signup')" data-i="start"></button><a class="btn ghost" href="#pricing" data-i="cta2"></a></div><small data-i="trial"></small></div></header>
<section id="features"><div class="wrap"><h2 data-i="features"></h2><div class="grid" id="fg"></div></div></section>
<section id="how" style="background:var(--glow)"><div class="wrap"><h2 data-i="how"></h2><div class="grid" id="sg"></div></div></section>
<section id="pricing"><div class="wrap"><h2 data-i="pricing"></h2><div class="tog"><button data-p="month" class="on" data-i="monthly"></button><button data-p="year"><span data-i="yearly"></span><em data-i="save"></em></button></div><div class="grid" id="pg"></div><p class="note" data-i="payNote"></p></div></section>
<section id="policy"><div class="wrap" style="max-width:780px"><h2 data-i="policy"></h2>
<details id="privacy"><summary data-i="p_priv"></summary><p data-i="p_priv_t"></p></details><details id="terms"><summary data-i="p_terms"></summary><p data-i="p_terms_t"></p></details><details id="cookies"><summary data-i="p_cook"></summary><p data-i="p_cook_t"></p></details></div></section>
<footer><div class="wrap"><div><img src="/logo-wordmark.png" alt="Vexalytics"><div data-i="tag"></div><div>© <span id="yr"></span> Vexalytics. <span data-i="rights"></span></div></div>
<nav><a href="#features" data-i="features"></a><a href="#pricing" data-i="pricing"></a><a href="/privacy" data-i="privacy"></a><a href="/terms" data-i="terms"></a><a href="/cookies" data-i="cookies"></a></nav></div></footer>
<div class="modal" id="m" onclick="if(event.target===this)closeM()"><div class="card box"><button class="x" onclick="closeM()">×</button><h3 id="mt"></h3>
<form id="f" onsubmit="return go(event)"><input id="nm" data-ph="name" autocomplete="name"><input id="em" type="email" data-ph="email" required autocomplete="email"><input id="pw" type="password" data-ph="pw" required autocomplete="current-password">
<div class="err" id="er"></div><button class="btn" style="width:100%;margin-top:6px" id="sub"></button></form>
<div class="sw"><span id="sq"></span> <button class="lnk" id="swb" onclick="openM(mode==='login'?'signup':'login')"></button></div></div></div>
<script src="/i18n.js"></script>
<script>
const F=[['📊','f1'],['⏰','f2'],['🎯','f3'],['💚','f4'],['✨','f5'],['📱','f6']];let per='month',plans=[],mode='login';
const $=s=>document.querySelector(s);
function draw(){$('#fg').innerHTML=F.map(([i,k])=>`<div class="card"><div class="ic">${i}</div><h3>${T(k+'t')}</h3><p>${T(k+'d')}</p></div>`).join('');
$('#sg').innerHTML=[1,2,3].map(n=>`<div class="card step"><b>${n}</b><h3>${T('s'+n+'t')}</h3><p>${T('s'+n+'d')}</p></div>`).join('');
$('#pg').innerHTML=plans.map((p,i)=>`<div class="card plan ${i===1?'pop':''}">${i===1?`<span class="badge">${T('pop')}</span>`:''}<h3>${p.name}</h3><div class="price">${money(per==='year'?p.price_year:p.price_month)} <small>${T(per==='year'?'perYear':'perMonth')}</small></div>
<ul><li>${T('sites',p.max_sites)}</li><li>${T(p.platforms>1?'plats':'plat1')}</li><li>${T(p.ai?'ai':'noai')}</li></ul><button class="btn ${i===1?'':'ghost'}" onclick="openM('signup')">${T('choose')} ${p.name}</button></div>`).join('');
$('#yr').textContent=new Date().getFullYear()}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l,()=>{draw();renderM()}));
document.querySelectorAll('.tog button').forEach(b=>b.onclick=()=>{per=b.dataset.p;document.querySelectorAll('.tog button').forEach(x=>x.classList.toggle('on',x===b));draw()});
function openM(m){mode=m;$('#m').classList.add('open');renderM()}
function renderM(){const a=false,s=mode==='signup';$('#nm').style.display=s?'':'none';$('#em').style.display=a?'none':'';$('#em').required=!a;
 $('#mt').textContent=T(a?'admin':s?'create':'signin');$('#sub').textContent=T(a?'signin':s?'create':'signin');$('#sq').textContent=T(s?'haveAcc':'noAcc');$('#swb').textContent=T(s?'signin':'start');$('#er').textContent=''}
function closeM(){$('#m').classList.remove('open')}
async function go(e){e.preventDefault();$('#er').textContent='';const body={email:$('#em').value,password:$('#pw').value,name:$('#nm').value,lang:L};
 const r=await fetch(mode==='signup'?'/api/register':'/api/ulogin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 if(r.ok)return location.href='/portal.html';const j=await r.json().catch(()=>({}));$('#er').textContent=T('err_'+(j.error||''))!=='err_'+(j.error||'')?T('err_'+j.error):T('err')}
const path=location.pathname.slice(1);if(['privacy','terms','cookies'].includes(path)){const d=document.getElementById(path);d.open=true;setTimeout(()=>d.scrollIntoView({behavior:'smooth'}),300)}
fetch('/api/me').then(r=>r.ok&&r.json()).then(j=>{if(j)document.querySelector('.acts .btn.sm:last-child').onclick=()=>location.href='/portal.html'}).catch(()=>{});
plans=[{name:'Starter',price_month:1900,price_year:19000,max_sites:1,platforms:1,ai:false},{name:'Growth',price_month:4900,price_year:49000,max_sites:3,platforms:3,ai:true},{name:'Pro',price_month:9900,price_year:99000,max_sites:10,platforms:3,ai:true}];
initTheme();applyLang(draw);fetch('/api/plans').then(r=>r.json()).then(j=>{if(j.plans&&j.plans.length){plans=j.plans;draw()}}).catch(()=>{});
</script></body></html>
