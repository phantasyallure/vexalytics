<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vexalytics Admin</title><meta name="theme-color" content="#150a11"><meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon-32.png"><link rel="stylesheet" href="/shared.css">
<style>
header{position:sticky;top:0;z-index:10;background:var(--nav);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}header .wrap{display:flex;align-items:center;gap:12px;height:60px}header img{height:28px}.sp{flex:1}
main{padding:24px 0 calc(60px + env(safe-area-inset-bottom))}h2{font-size:26px;margin:0 0 14px}h3{font-size:17px;margin-bottom:10px}p.m{color:var(--mute);font-size:14px}.stack>*+*{margin-top:16px}
.pl{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.pl:last-child{border:0}.row{display:flex;gap:8px;align-items:center}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}.ok{background:#3ddc9722;color:var(--ok)}.no{background:#8a6a9022;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:start}th{color:var(--mute);font-weight:600}.tw{overflow-x:auto}.sel{width:auto;margin:0;padding:8px 10px}td input{margin:0}
.login{max-width:380px;margin:12vh auto 0}
@media(max-width:520px){header .wrap{height:56px;gap:6px}header img{height:24px}main{padding-top:16px}h2{font-size:22px}.pl{flex-direction:column;align-items:flex-start}.pl .row{width:100%}.pl .row .btn{flex:1}.login{margin-top:6vh}table{min-width:560px}}.login h2{margin-bottom:6px}
</style></head><body>
<header><div class="wrap"><a href="/"><img src="/logo-wordmark.png" alt="Vexalytics"></a><span class="sp"></span><span class="pill no">Admin</span><button class="thm" id="thm" type="button" aria-label="Theme"></button><a class="btn ghost sm" id="so" href="/api/signout" style="display:none">Log out</a></div></header>
<main class="wrap"><div id="v" class="stack"></div></main>
<script src="/i18n.js"></script>
<script>
const $=s=>document.querySelector(s),J=async(u,b)=>{const r=await fetch(u,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'err'),{code:j.error});return j};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt=d=>d?new Date(d).toLocaleDateString('en-GB'):'';
const m=n=>new Intl.NumberFormat('en-US').format(n)+' DA';let adm=null;
async function boot(){initTheme();let S={};try{S=await J('/api/status')}catch{}
 if(S.admin){$('#so').style.display='';try{adm=await J('/api/adm');return draw()}catch{}}
 login()}
function login(){$('#v').innerHTML=`<div class="card login"><h2>Admin</h2><p class="m">Owner access only.</p><form onsubmit="return go(event)"><input id="pw" type="password" placeholder="Password" required autocomplete="current-password"><div class="err" id="er"></div><button class="btn" style="width:100%;margin-top:6px">Log in</button></form></div>`}
async function go(e){e.preventDefault();$('#er').textContent='';try{const r=await J('/api/auth',{password:$('#pw').value});if(r.role!=='owner'){await fetch('/api/signout');throw new Error('Owner password required.')}location.reload()}catch(x){$('#er').textContent=x.message==='err'?'Wrong password.':x.message}}
async function a_(b){adm=await J('/api/adm',b);draw()}
function draw(){const pn=id=>(adm.plans.find(p=>p.id===id)||{}).name||'—',opt=p=>adm.plans.map(x=>`<option value="${x.id}" ${x.id===p?'selected':''}>${esc(x.name)}</option>`).join('');
 const blank={id:0,name:'',price_month:0,price_year:0,max_sites:1,platforms:3,ai:false,active:true,sort:adm.plans.length+1};
 $('#v').innerHTML=`<h2>Administration</h2>
<div class="card"><h3>Plan requests (${adm.requests.length})</h3>${adm.requests.map(r=>{const u=adm.users.find(x=>x.id===r.account_id)||{};return`<div class="pl"><span>${esc(u.email)} → <b>${esc(pn(r.plan_id))}</b> · ${r.interval}</span><span class="row"><button class="btn sm" onclick="a_({op:'grant',account:${r.account_id},plan:${r.plan_id},interval:'${r.interval}',request:${r.id}})">Activate</button><button class="btn ghost sm" onclick="a_({op:'reject',request:${r.id}})">Reject</button></span></div>`}).join('')||'<p class="m">No pending requests.</p>'}</div>
<div class="card"><h3>Plans &amp; pricing</h3><div class="tw"><table><tr><th>Name</th><th>Monthly</th><th>Yearly</th><th>Pages</th><th>AI</th><th>Visible</th><th></th></tr>${adm.plans.concat([blank]).map(p=>`<tr data-id="${p.id}" data-pl="${p.platforms}" data-so="${p.sort}"><td><input value="${esc(p.name)}" placeholder="New plan" style="min-width:90px"></td><td><input type="number" value="${p.price_month}" style="width:90px"></td><td><input type="number" value="${p.price_year}" style="width:100px"></td><td><input type="number" value="${p.max_sites}" style="width:60px"></td><td><input type="checkbox" ${p.ai?'checked':''} style="width:auto"></td><td><input type="checkbox" ${p.active?'checked':''} style="width:auto"></td><td><button class="btn sm" onclick="savePlan(this)">Save</button></td></tr>`).join('')}</table></div></div>
<div class="card"><h3>Accounts (${adm.users.length})</h3><div class="tw"><table>${adm.users.map(u=>`<tr><td>${esc(u.email)}<br><span class="m" style="font-size:12px">${esc(u.name||'')}</span></td><td><select class="sel" id="g${u.id}">${opt(u.plan_id)}</select></td><td><select class="sel" id="i${u.id}"><option value="month">Monthly</option><option value="year">Yearly</option></select></td><td><button class="btn sm" onclick="a_({op:'grant',account:${u.id},plan:+$('#g${u.id}').value,interval:$('#i${u.id}').value})">Activate</button></td><td><span class="pill ${u.plan_status==='active'?'ok':'no'}">${u.plan_status||'trial'}${u.plan_until?' · '+dt(u.plan_until):''}</span></td><td><button class="btn ghost sm" onclick="a_({op:'suspend',account:${u.id},on:${!u.suspended}})">${u.suspended?'Restore':'Suspend'}</button></td></tr>`).join('')}</table></div></div>
<a class="btn ghost" href="/app.html">Open owner dashboard →</a>`}
function savePlan(b){const r=b.closest('tr'),i=[...r.querySelectorAll('input')];a_({op:'plan',id:+r.dataset.id,name:i[0].value,price_month:i[1].value,price_year:i[2].value,max_sites:i[3].value,ai:i[4].checked,active:i[5].checked,platforms:+r.dataset.pl,sort:+r.dataset.so})}
boot();
</script></body></html>
