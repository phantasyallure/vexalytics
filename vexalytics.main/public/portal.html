<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vexalytics</title><meta name="theme-color" content="#fbf6fb"><script>try{document.documentElement.dataset.theme=localStorage.getItem('vx_theme')||'light'}catch(e){}</script>
<link rel="icon" href="/favicon-32.png"><link rel="stylesheet" href="/shared.css">
<style>
header{position:sticky;top:0;z-index:10;background:var(--nav);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}header .wrap{display:flex;align-items:center;gap:12px;height:60px}header img{height:28px}.sp{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 0;scrollbar-width:none}.tabs button{border:1px solid var(--line);background:var(--card);color:var(--mute);font:600 14px inherit;font-family:inherit;padding:9px 16px;border-radius:10px;cursor:pointer;white-space:nowrap}.tabs button.on{background:var(--a1);border-color:var(--a1);color:#fff}
main{padding:6px 0 calc(60px + env(safe-area-inset-bottom))}h2{font-size:24px;margin:8px 0 14px}h3{font-size:17px;margin-bottom:6px}p.m{color:var(--mute);font-size:14px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.k{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.k b{display:block;font-size:26px;font-weight:800;margin-top:4px}.k span{color:var(--mute);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>input{flex:1;min-width:150px;margin:0}.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}.ok{background:#3ddc9722;color:var(--ok)}.no{background:#ffffff14;color:var(--mute)}
pre{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto;font-size:13px;direction:ltr;text-align:left;margin:10px 0}
.bars{display:flex;align-items:flex-end;gap:2px;height:90px;margin:12px 0}.bars i{flex:1;background:linear-gradient(180deg,var(--a1),var(--a2));border-radius:3px 3px 0 0;min-height:2px}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:800}.ring:before{content:"";position:absolute}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:start}th{color:var(--mute);font-weight:600}.tw{overflow-x:auto}
.pl{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.pl:last-child{border:0}.sel{width:auto;margin:0;padding:8px 10px}.stack>*+*{margin-top:16px}
</style></head><body>
<header><div class="wrap"><a href="/"><img class="logo-l" src="/logo-wordmark-dark.png" alt="Vexalytics"><img class="logo-d" src="/logo-wordmark.png" alt="Vexalytics"></a><span class="sp"></span><div class="lang"><button class="ibtn" type="button" aria-label="Language"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.6 4 5.7 4 9s-1.4 6.4-4 9c-2.6-2.6-4-5.7-4-9s1.4-6.4 4-9z"/></svg><span class="cur">EN</span></button><div class="menu"><button type="button" data-l="en">English</button><button type="button" data-l="fr">Français</button><button type="button" data-l="ar">العربية</button></div></div><button class="ibtn th" type="button" aria-label="Toggle theme"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button class="btn ghost sm" onclick="out()" data-i="logout"></button></div></header>
<main class="wrap"><div class="tabs" id="tabs"></div><div id="v" class="stack"></div></main>
<script src="/i18n.js"></script>
<script>
const $=s=>document.querySelector(s),J=async(u,b)=>{const r=await fetch(u,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'err'),{code:j.error});return j};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={},ME=null,tab='overview',plans=[],site=null,days=30,sites=[],origin='',adm=null,lastTab=null;
const dt=d=>d?new Date(d).toLocaleDateString(L==='ar'?'ar-DZ':L):'';
async function boot(){S=await J('/api/status');if(!S.authed)return location.replace('/');
 if(S.account){ME=await J('/api/me')}plans=(await J('/api/plans')).plans;
 const t=[['overview','overview'],['connections','connections'],['website','website']];if(S.account||S.admin)t.push(['plan','plan']);if(S.admin)t.push(['adm','adminT']);
 $('#tabs').innerHTML=t.map(([k,l])=>`<button data-t="${k}" data-i="${l}"></button>`).join('');
 $('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;view()}};
 const h=location.hash.slice(1);if(t.some(x=>x[0]===h))tab=h;applyLang(view)}
function view(){document.querySelectorAll('#tabs button').forEach(b=>{b.classList.toggle('on',b.dataset.t===tab);b.textContent=T(b.dataset.i)});history.replaceState(0,'','#'+tab);({overview:vOver,connections:vConn,website:vWeb,plan:vPlan,adm:vAdm})[tab]()}
function planLine(){if(S.admin)return T('adminT');const a=ME.account;if(a.status==='active'&&a.until&&new Date(a.until)>new Date())return ME.limits.plan+' · '+T('active')+' '+dt(a.until);return a.until&&new Date(a.until)>new Date()?T('trialUntil')+' '+dt(a.until):T('expired')}
function vOver(){$('#v').innerHTML=`<h2>${T('welcome')}, ${esc(S.account?(ME.account.name||ME.account.email):'Admin')}</h2><div class="g"><div class="k"><span>${T('curPlan')}</span><b style="font-size:17px">${esc(planLine())}</b></div>
<div class="k"><span>${T('connections')}</span><b>${['ig','fb','tt'].filter(p=>S.plats&&S.plats[p]).length}/3</b></div></div><a class="btn" href="/app.html">${T('openDash')} →</a>`}
function vConn(){const p=S.plats||{},r=(n,on,url,lab)=>`<div class="pl"><span>${n} <span class="pill ${on?'ok':'no'}">${T(on?'connected':'notConn')}</span></span><a class="btn sm ${on?'ghost':''}" href="${url}">${lab}</a></div>`;
 $('#v').innerHTML=`<h2>${T('conn')}</h2><div class="card"><p class="m">${T('connD')}</p>${r('Instagram + Facebook',p.ig||p.fb,'/api/login',T('connectMeta'))}${r('TikTok',p.tt,'/api/ttlogin',T('connectTT'))}</div>`}
async function vWeb(){const d=await J('/api/sites');sites=d.sites;origin=d.origin;if(!site||!sites.find(s=>s.id===site))site=sites[0]&&sites[0].id;
 $('#v').innerHTML=`<h2>${T('website')}</h2><div class="card"><h3>${T('addSite')}</h3><div class="row"><input id="dm" data-ph="domain" placeholder="${T('domain')}"><button class="btn" onclick="addSite()">${T('add')}</button></div><div class="err" id="we"></div></div><div id="sites" class="stack"></div>`;
 $('#sites').innerHTML=sites.length?`<div class="row">${sites.map(s=>`<button class="btn sm ${s.id===site?'':'ghost'}" onclick="site=${s.id};vWeb()">${esc(s.domain)}</button>`).join('')}<span class="sp"></span><select class="sel" onchange="days=+this.value;vWeb()">${[7,30,90].map(n=>`<option ${n===days?'selected':''} value="${n}">${n} ${T('days')}</option>`).join('')}</select></div><div id="st" class="stack"></div>`:'';
 if(site){const s=sites.find(x=>x.id===site),snip=`<script async src="${origin}/px.js" data-key="${s.key}"><\/script>`;let x;try{x=await J('/api/sitestats?id='+site+'&days='+days)}catch{return}
 const col=x.score==null?'var(--mute)':x.score>=80?'var(--ok)':x.score>=55?'var(--warn)':'var(--bad)',lab=x.score==null?'—':T(x.score>=80?'s_ok':x.score>=55?'s_mid':'s_bad'),mx=Math.max(1,...x.daily.map(d=>d.views));
 $('#st').innerHTML=`<div class="card"><h3>${T('install')}</h3><p class="m">${T('installD')}</p><pre id="sn">${esc(snip)}</pre><div class="row"><button class="btn sm" onclick="navigator.clipboard.writeText($('#sn').textContent);this.textContent=T('copied')">${T('copy')}</button><span class="pill ${x.last?'ok':'no'}">${x.last?T('connected')+' · '+dt(x.last):T('waiting')}</span><span class="sp"></span><button class="btn ghost sm" onclick="delSite(${s.id})">${T('del')}</button></div><p class="m" style="margin-top:10px">${T('orderTip')}</p></div>
 <div class="card row" style="gap:20px"><div class="ring" style="background:conic-gradient(${col} ${(x.score||0)*3.6}deg,#2e1a35 0);position:relative"><span style="background:var(--card);width:76px;height:76px;border-radius:50%;display:grid;place-items:center;color:${col}">${x.score??'—'}</span></div><div><h3>${T('health')}: <span style="color:${col}">${lab}</span></h3><p class="m">${T('load')}: ${x.avgLoad?x.avgLoad+' ms':'—'} · ${T('errors')}: ${x.errors}</p></div></div>
 <div class="g"><div class="k"><span>${T('visitors')}</span><b>${x.visitors}</b></div><div class="k"><span>${T('views')}</span><b>${x.views}</b></div><div class="k"><span>${T('orders')}</span><b>${x.orders}</b></div><div class="k"><span>${T('revenue')}</span><b style="font-size:20px">${x.revenue?money(x.revenue):'—'}</b></div><div class="k"><span>${T('conv')}</span><b>${x.conv.toFixed(1)}%</b></div></div>
 <div class="card"><div class="bars">${x.daily.map(d=>`<i title="${d.d}: ${d.views}" style="height:${d.views/mx*100}%"></i>`).join('')}</div></div>
 <div class="g" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"><div class="card"><h3>${T('topPages')}</h3>${x.pages.map(p=>`<div class="pl"><span style="direction:ltr;overflow:hidden;text-overflow:ellipsis">${esc(p[0])}</span><b>${p[1]}</b></div>`).join('')||'—'}</div><div class="card"><h3>${T('sources')}</h3>${x.sources.map(p=>`<div class="pl"><span>${esc(p[0])}</span><b>${p[1]}</b></div>`).join('')||'—'}</div></div>`}}
async function addSite(){try{await J('/api/sites',{domain:$('#dm').value});vWeb()}catch(e){$('#we').textContent=e.code==='site_limit'?T('plan')+' ↑':T('err')}}
async function delSite(id){if(confirm(T('del')+'?')){await J('/api/sites',{del:id});site=null;vWeb()}}
function vPlan(){const a=ME&&ME.account,pend=ME&&ME.pending[0];
 $('#v').innerHTML=`<h2>${T('plan')}</h2><div class="card"><p class="m">${T('curPlan')}</p><h3>${esc(planLine())}</h3>${pend?`<span class="pill no">${T('pending')}: ${esc((plans.find(p=>p.id===pend.plan_id)||{}).name)} · ${T(pend.interval)}</span>`:''}</div><div class="g" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${plans.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><p class="m">${money(p.price_month)} ${T('perMonth')}<br>${money(p.price_year)} ${T('perYear')}</p><p class="m" style="margin:8px 0">${T('sites',p.max_sites)} · ${T(p.ai?'ai':'noai')}</p><div class="row"><button class="btn sm" onclick="req(${p.id},'month')">${T('monthly')}</button><button class="btn sm ghost" onclick="req(${p.id},'year')">${T('yearly')}</button></div></div>`).join('')}</div><p class="m" id="rq">${T('payNote')}</p>`}
async function req(id,iv){if(!S.account)return;await J('/api/planreq',{plan:id,interval:iv});ME=await J('/api/me');vPlan();$('#rq').textContent=T('requested')}
async function vAdm(){adm=adm||await J('/api/adm');drawAdm()}
async function adm_(b){adm=await J('/api/adm',b);drawAdm()}
function drawAdm(){const pn=id=>(adm.plans.find(p=>p.id===id)||{}).name||'—',opt=p=>adm.plans.map(x=>`<option value="${x.id}" ${x.id===p?'selected':''}>${esc(x.name)}</option>`).join('');
 $('#v').innerHTML=`<h2>${T('adminT')}</h2><div class="card"><h3>${T('requests')} (${adm.requests.length})</h3>${adm.requests.map(r=>{const u=adm.users.find(x=>x.id===r.account_id)||{};return`<div class="pl"><span>${esc(u.email)} → <b>${esc(pn(r.plan_id))}</b> · ${T(r.interval)}</span><span class="row"><button class="btn sm" onclick="adm_({op:'grant',account:${r.account_id},plan:${r.plan_id},interval:'${r.interval}',request:${r.id}})">${T('grant')}</button><button class="btn ghost sm" onclick="adm_({op:'reject',request:${r.id}})">${T('reject')}</button></span></div>`}).join('')||'<p class="m">—</p>'}</div>
 <div class="card"><h3>${T('plansT')}</h3><div class="tw"><table><tr><th>${T('pName')}</th><th>${T('pM')}</th><th>${T('pY')}</th><th>${T('pS')}</th><th>${T('pA')}</th><th>${T('pAct')}</th><th></th></tr>${adm.plans.concat([{id:0,name:'',price_month:0,price_year:0,max_sites:1,platforms:3,ai:false,active:true,sort:adm.plans.length+1}]).map(p=>`<tr data-id="${p.id}" data-pl="${p.platforms}" data-so="${p.sort}"><td><input value="${esc(p.name)}" placeholder="${T('newPlan')}" style="margin:0;min-width:90px"></td><td><input type="number" value="${p.price_month}" style="margin:0;width:90px"></td><td><input type="number" value="${p.price_year}" style="margin:0;width:100px"></td><td><input type="number" value="${p.max_sites}" style="margin:0;width:60px"></td><td><input type="checkbox" ${p.ai?'checked':''} style="width:auto;margin:0"></td><td><input type="checkbox" ${p.active?'checked':''} style="width:auto;margin:0"></td><td><button class="btn sm" onclick="savePlan(this)">${T('save2')}</button></td></tr>`).join('')}</table></div></div>
 <div class="card"><h3>${T('users')} (${adm.users.length})</h3><div class="tw"><table>${adm.users.map(u=>`<tr><td>${esc(u.email)}<br><span class="m" style="font-size:12px">${esc(u.name||'')}</span></td><td><select class="sel" id="g${u.id}">${opt(u.plan_id)}</select></td><td><select class="sel" id="i${u.id}"><option value="month">${T('month')}</option><option value="year">${T('year')}</option></select></td><td><button class="btn sm" onclick="adm_({op:'grant',account:${u.id},plan:+$('#g${u.id}').value,interval:$('#i${u.id}').value})">${T('grant')}</button></td><td><span class="pill ${u.plan_status==='active'?'ok':'no'}">${u.plan_status}${u.plan_until?' · '+dt(u.plan_until):''}</span></td><td><button class="btn ghost sm" onclick="adm_({op:'suspend',account:${u.id},on:${!u.suspended}})">${T(u.suspended?'restore':'suspend')}</button></td></tr>`).join('')}</table></div></div>`}
function savePlan(b){const r=b.closest('tr'),i=[...r.querySelectorAll('input')];adm_({op:'plan',id:+r.dataset.id,name:i[0].value,price_month:i[1].value,price_year:i[2].value,max_sites:i[3].value,ai:i[4].checked,active:i[5].checked,platforms:+r.dataset.pl,sort:+r.dataset.so}).then(()=>{plans=adm.plans})}
function out(){document.cookie='';location.href='/api/signout'}
initUI(view);
boot();
</script></body></html>
